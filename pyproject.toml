[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mochi"
version = "0.18.1"
description = "macOS-first OpenVPN dashboard with split routing and Keychain storage"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools]
py-modules = ["app", "auth", "core", "dialogs", "dns_rules", "helper", "keychain", "launch", "management", "profiles", "server_profile", "settings", "subscriptions", "subscription_ui", "desktop_launch", "desktop_bootstrap", "ui_widgets", "runtime_paths", "tray_control"]
